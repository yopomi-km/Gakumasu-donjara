<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学マス ドンジャラ（1対1）</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>学マス ドンジャラ（1対1）</h1>
    <div class="sub">3メンツ＋2ヘッド（14枚）で「上がり宣言」。点数計算なし・宣言は言ったもん勝ち。</div>
  </header>
  <main>
    <section class="panel controls">
      <div class="area-title">メニュー</div>
      <button id="btnNew">新規開始</button>
      <button id="btnDraw" class="secondary">自動ツモ</button>
      <label class="toggle"><input type="checkbox" id="chkAutoSort" checked />自動整理</label>
      <div class="pile">
        <div class="badge">残り</div>
        <div class="count" id="deckCount">0</div>
        <div class="badge" id="turnBadge">先手</div>
      </div>
      <div class="yaku" id="yakuResult">役: なし</div>
      <span class="status" id="status">準備中</span>
    </section>

    <section class="panel controls">
      <div class="area-title">デバッグメニュー</div>
      <details class="debug-menu">
        <summary>開閉</summary>
        <div class="controls">
          <button id="btnDebug" class="secondary">デバッグ：四槓子配牌</button>
          <button id="btnDebugPon" class="secondary">デバッグ：即ポン配牌</button>
          <button id="btnDebugReiris" class="secondary">デバッグ：Re;IRIS配牌</button>
          <button id="btnDebugBegrazia" class="secondary">デバッグ：Begrazia配牌</button>
          <button id="btnDebugSyngUp" class="secondary">デバッグ：SyngUp!配牌</button>
          <button id="btnDebugRed" class="secondary">デバッグ：SUPREMACY配牌</button>
          <button id="btnDebugBlue" class="secondary">デバッグ：ICHI-NO-NI配牌</button>
          <button id="btnDebugPurple" class="secondary">デバッグ：ナイワ配牌</button>
          <button id="btnDebugRon" class="secondary">デバッグ：即ロン配牌</button>
        </div>
      </details>
    </section>

    <section class="panel row">
      <div class="area-title">相手の手配</div>
      <div class="hand small" id="oHand"></div>
      <div class="status">CPUは自動で捨てます</div>
    </section>

    <section class="panel row">
      <div class="area-title">相手の捨て牌</div>
      <div class="river" id="riverO"></div>
    </section>

    <section class="panel row">
      <div class="area-title">自分の捨て牌</div>
      <div class="river" id="riverP"></div>
    </section>

    <section class="panel controls">
      <div class="area-title">アクション</div>
      <button id="btnKan" class="secondary">カン</button>
      <button id="btnPon">ポン</button>
      <button id="btnRon">ロン</button>
      <button id="btnTsumo" class="secondary">ツモ</button>
      <button id="btnSkip" class="secondary">スキップ</button>
      <div class="prompt show" id="ponPrompt">
        <span id="ponText">ポンできます</span>
      </div>
    </section>

    <section class="panel row">
      <div class="area-title">自分の手配</div>
      <div class="hand" id="pHand"></div>
      <div class="status"></div>
      <div class="area-title">カンした牌（右下）</div>
      <div class="kan-area" id="kanArea"></div>
      <div class="area-title">ポンした牌（右下）</div>
      <div class="pon-area" id="ponArea"></div>
    </section>

    <section class="panel row">
      <div class="area-title">ログ</div>
      <div class="log" id="log"></div>
    </section>
  </main>
  <div class="modal" id="winModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-title">上がり</div>
      <div class="modal-section">
        <div class="area-title">手配</div>
        <div class="modal-tiles" id="winTiles"></div>
      </div>
      <div class="modal-section">
        <div class="area-title">役</div>
        <div id="winYaku">なし</div>
      </div>
      <div class="modal-actions">
        <button id="btnWinNew">新規開始</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
